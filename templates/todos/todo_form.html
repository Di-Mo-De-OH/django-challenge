{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="mx-auto card shadow-sm border-0 bg-light" style="max-width: 520px;">
        <div class="card-body p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="text-dark small">
                    {{ form.as_p }}
                </div>

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary btn-sm py-2">
                        {% if btn_name %}
                            {{ btn_name }}
                        {% else %}
                             저장
                        {% endif %}
                    </button>
                </div>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <a href="{% url 'todo:list' %}" class="text-decoration-none fw-semibold">
                    To Do 페이지로 돌아가기
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
