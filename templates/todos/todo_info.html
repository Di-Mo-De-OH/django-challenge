<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="todo-list">
        {% if request.user.is_authenticated %}
        <h1>할일: {{todo.title}}</h1>
        <hr>
        <div class="todo">
        <p>설명: {{todo.description}}</p>
        <p>시작시간: {{todo.start_date}}</p>
        <p>끝내는 시간: {{todo.end_date}}</p>
        <p>완료여부: {{todo.is_completed}}</p>
        </div>    
        {% endif %}
        <a href="{% url 'todo_list' %}">할일 목록으로 돌아가기</a>
    </div>
    
</body>
</html>
