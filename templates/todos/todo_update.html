{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="mx-auto card shadow-sm border-0 bg-light" style="max-width: 520px;">
        <div class="card-body p-4">

            <h1 class="text-center fw-bold text-dark mb-4">할 일 수정</h1>

            <form method="post">
                {% csrf_token %}

                <div class="text-dark small">
                    {{ form.as_p }}
                </div>

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary btn-sm py-2">
                        수정 완료
                    </button>
                </div>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <a href="{% url 'todo:info' todo.id %}" class="text-decoration-none fw-semibold">
                    상세 페이지로 돌아가기
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
