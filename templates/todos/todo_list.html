{% extends "base.html" %}

{% block content %}

{% for todo in object_list %}
    <div class="my-4 text-center">
        <a href="{% url 'todo:info' todo.pk %}" class="d-inline-flex align-items-center gap-2 text-decoration-none">

            {% if todo.get_thumbnail_img_url %}
                <img src="{{ todo.get_thumbnail_img_url }}" alt="" class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
            {% endif %}

            <div>
                <div class="fs-6 fw-bold">
                    {{ todo.title }}
                </div>
                <div class="fs-8 text-muted">
                    {{ todo.created_at }}
                </div>
            </div>
        </a>
    </div>
{% endfor %}

{% include "pagination.html" %}

{% endblock %}
