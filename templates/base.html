{%load static%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href ="{% static 'css/bootstrap.css' %}" rel="stylesheet">

</head>
<body style=" background-color: #f4f8fb;">
<div class="todo-page">
    {% if request.user.is_authenticated %}
        <nav class="my-4 text-center">
            <a href="{% url 'todo:create' %}" class="fs-4 fw-bold text-decoration-none">
                TO DO 작성하기📕
            </a>
        </nav>

        <div>
            <nav class="d-flex justify-content-between align-items-center">
                
                <div>
                    <a href="{% url 'todo:list' %}" class="btn btn-outline-primary">
                        홈
                    </a>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-3">
                    <p class="mb-0 badge rounded-pill text-bg-light px-3 py-2 fs-5">
                        {{ request.user.username }} 님 안녕하세요!😁
                    </p>

                    <form action="{% url 'logout' %}" method="POST" class="mb-0">
                        {% csrf_token %}
                        <button class="btn btn-danger">로그아웃</button>
                    </form>
                </div>

            </nav>
        </div>
    {% endif %}
</div>
{% block content %}


    {% endblock %}
    
</body>
</html>
